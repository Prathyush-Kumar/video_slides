<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slideshow</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: contain;   /* use "cover" to fill the window and crop edges */
    background: #000;
    pointer-events: none;  /* blocks clicks and the right-click menu on the video */
  }
</style>
</head>
<body>

<video id="v" src="Avatar_Interviewer.mp4" autoplay muted loop playsinline
       disablepictureinpicture disableremoteplayback
       controlslist="nodownload noplaybackrate noremoteplayback"></video>

<script>
  const video = document.getElementById('v');
  video.play().catch(() => {});
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.key === 'k') e.preventDefault();
  });
  video.addEventListener('pause', () => video.play().catch(() => {}));
</script>
</body>
</html>
