<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slideshow</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: absolute; transform-origin: top left; opacity: 0; }
  #msg {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #aaa; font: 1rem system-ui, sans-serif; text-align: center; padding: 2rem;
  }
</style>
</head>
<body>

<div id="msg">Loading…</div>
<div id="stage"></div>

<script src="https://cdn.jsdelivr.net/npm/pptx-preview@1.0.7/dist/pptx-preview.umd.js"></script>
<script>
  // ---------- Settings: change these ----------
  // The pod comes from the link: .../?pod=3 plays the file listed for pod 3.
  // Each file sits in the same repo folder (or use a full raw.githubusercontent.com URL).
  const PODS = {
    1: "Avatar_Interviewer.pptx",
    2: "pod2.pptx",
    3: "pod3.pptx",
    4: "pod4.pptx",
    5: "pod5.pptx",
    6: "pod6.pptx",
    7: "pod7.pptx"
  };
  const pod = new URLSearchParams(location.search).get('pod');
  const PPTX_URL = /^[1-7]$/.test(pod || '') ? PODS[pod] : null;
  const SECONDS  = 5;           // time per slide (includes the fade)
  const FADE_MS  = 700;         // fade out/in duration in milliseconds
  const SLIDE_W  = 960;         // 16:9 slides. For 4:3 decks use 960 x 720
  const SLIDE_H  = 540;
  // --------------------------------------------

  const stage = document.getElementById('stage');
  const msg = document.getElementById('msg');

  // Scale the slide to fit the browser window
  function fit() {
    const s = Math.min(innerWidth / SLIDE_W, innerHeight / SLIDE_H);
    stage.style.transform = `scale(${s})`;
    stage.style.left = (innerWidth  - SLIDE_W * s) / 2 + 'px';
    stage.style.top  = (innerHeight - SLIDE_H * s) / 2 + 'px';
  }
  addEventListener('resize', fit);
  fit();

  async function run() {
    if (!PPTX_URL) {
      msg.textContent = 'No presentations available';
      return;
    }
    try {
      const res = await fetch(PPTX_URL);
      if (!res.ok) throw new Error('Could not load ' + PPTX_URL + ' (' + res.status + ')');
      const buf = await res.arrayBuffer();

      const viewer = pptxPreview.init(stage, { width: SLIDE_W, height: SLIDE_H, mode: 'slide' });
      await viewer.preview(buf);

      // Hide the library's built-in next/prev buttons and page counter
      [...viewer.wrapper.children].forEach(el => {
        if (!/pptx-preview-slide-wrapper/.test(el.className)) el.style.display = 'none';
      });
      viewer.wrapper.style.overflow = 'hidden';

      msg.remove();
      // Fade the stage's opacity from one value to another
      const fade = (from, to) => {
        stage.style.opacity = to;                       // final state
        return stage.animate(
          [{ opacity: from }, { opacity: to }],
          { duration: FADE_MS, easing: 'ease-in-out' }
        ).finished;
      };

      console.log('pptx-slideshow: fade version, slides =', viewer.slideCount);
      await fade(0, 1);                                  // fade in first slide

      // Every N seconds: fade out, switch slide, fade in. Loops after the last slide.
      if (viewer.slideCount > 1) {
        setInterval(async () => {
          await fade(1, 0);
          viewer.renderNextSlide();
          await fade(0, 1);
        }, SECONDS * 1000);
      }
    } catch (err) {
      console.error(err);
      msg.textContent = 'No presentations available';
    }
  }
  run();
</script>
</body>
</html>
