<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slideshow</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: absolute; transform-origin: top left; opacity: 0; transition: opacity 0.7s ease; }
  #msg {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #aaa; font: 1rem system-ui, sans-serif; text-align: center; padding: 2rem;
  }
</style>
</head>
<body>

<div id="msg">Loading…</div>
<div id="stage"></div>

<script src="https://cdn.jsdelivr.net/npm/pptx-preview@1.0.7/dist/pptx-preview.umd.js"></script>
<script>
  // ---------- Settings: change these ----------
  const PPTX_URL = "Avatar_interviewer.pptx"; // file in the same repo folder, or a full raw.githubusercontent.com URL
  const SECONDS  = 5;           // time per slide (includes the fade)
  const FADE_MS  = 700;         // fade out/in duration in milliseconds
  const SLIDE_W  = 960;         // 16:9 slides. For 4:3 decks use 960 x 720
  const SLIDE_H  = 540;
  // --------------------------------------------

  const stage = document.getElementById('stage');
  const msg = document.getElementById('msg');

  // Scale the slide to fit the browser window
  function fit() {
    const s = Math.min(innerWidth / SLIDE_W, innerHeight / SLIDE_H);
    stage.style.transform = `scale(${s})`;
    stage.style.left = (innerWidth  - SLIDE_W * s) / 2 + 'px';
    stage.style.top  = (innerHeight - SLIDE_H * s) / 2 + 'px';
  }
  addEventListener('resize', fit);
  fit();

  async function run() {
    try {
      const res = await fetch(PPTX_URL);
      if (!res.ok) throw new Error('Could not load ' + PPTX_URL + ' (' + res.status + ')');
      const buf = await res.arrayBuffer();

      const viewer = pptxPreview.init(stage, { width: SLIDE_W, height: SLIDE_H, mode: 'slide' });
      await viewer.preview(buf);

      // Hide the library's built-in next/prev buttons and page counter
      [...viewer.wrapper.children].forEach(el => {
        if (!/pptx-preview-slide-wrapper/.test(el.className)) el.style.display = 'none';
      });
      viewer.wrapper.style.overflow = 'hidden';

      msg.remove();
      stage.style.transitionDuration = FADE_MS + 'ms';
      requestAnimationFrame(() => { stage.style.opacity = 1; }); // fade in first slide

      // Every N seconds: fade out, switch slide, fade in. Loops after the last slide.
      if (viewer.slideCount > 1) {
        setInterval(() => {
          stage.style.opacity = 0;
          setTimeout(() => {
            viewer.renderNextSlide();
            stage.style.opacity = 1;
          }, FADE_MS);
        }, SECONDS * 1000);
      }
    } catch (err) {
      console.error(err);
      msg.textContent = 'Could not load the slideshow. Check that the PPTX file name/path is correct and that the page is served over http(s), not opened as a local file.';
    }
  }
  run();
</script>
</body>
</html>
